# Deployed via .github/workflows/deploy.yml -> docker stack deploy -c … odoo-prod
#
# Prerequisite (once per swarm):
#   printf '%s' '<password>' | docker secret create odoo_db_password -
#
# STORAGE
# All state lives under /home/ralph/docker-volumes/odoo, which v10033.1blu.de
# exports over NFSv4 to the other swarm nodes (see /etc/exports). Every node
# therefore sees the same tree, so tasks can be rescheduled freely.
#
# Ownership matters: the odoo image runs as uid 100/gid 101 and declares
# USER odoo, so it cannot chown its own mounts -- the deploy workflow pre-seeds
# the directories. postgres (uid 70) starts as root and chowns its own.

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/odoo_db_password
    secrets:
      - odoo_db_password
    volumes:
      - type: bind
        source: /home/ralph/docker-volumes/odoo/postgres
        target: /var/lib/postgresql/data
    networks:
      - odoo_network
    deploy:
      replicas: 1
      placement:
        # Pinned to the node that OWNS the share, where this path is local ext4
        # rather than an NFS client mount -- a Postgres data directory over NFS
        # invites locking and fsync trouble. This costs no availability: if
        # v10033 is down the share is gone for every node anyway.
        constraints:
          - node.hostname == v10033.1blu.de
      restart_policy:
        condition: on-failure
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19
    # The official entrypoint only maps HOST/PORT/USER/PASSWORD to CLI flags --
    # WORKERS is not read. Multiprocessing must be set on the command line, and
    # it is what makes the gevent port (8072) listen at all.
    command: >
      odoo
      --workers 4
      --max-cron-threads 2
      --proxy-mode
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: postgresql
      PORT: 5432
      USER: odoo
      PASSWORD_FILE: /run/secrets/odoo_db_password
      # Third-party addons may need python packages the stock image lacks
      # (mcp_server needs authlib and packaging). They are pip-installed into
      # the shared tree rather than baked into an image, so every node sees
      # the same set and a restart does not lose them.
      PYTHONPATH: /mnt/pylibs
    secrets:
      - odoo_db_password
    volumes:
      - type: bind
        source: /home/ralph/docker-volumes/odoo/data
        target: /var/lib/odoo
      - type: bind
        source: /home/ralph/docker-volumes/odoo/addons
        target: /mnt/extra-addons
      - type: bind
        source: /home/ralph/docker-volumes/odoo/pylibs
        target: /mnt/pylibs
        read_only: true
    networks:
      - odoo_network
    # Unconstrained on purpose: filestore and sessions are on the shared tree,
    # so this may run on any node and still serve the same state.
    # NOTE: swarm ignores depends_on, so odoo may start before postgres is
    # ready. The entrypoint's wait-for-psql (30s) plus restart_policy cover it.
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

networks:
  odoo_network:
    driver: overlay

secrets:
  odoo_db_password:
    external: true
